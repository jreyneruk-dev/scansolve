<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScanSolve — offline</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f8fafc;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #0f172a; }
  main { max-width: 320px; padding: 24px; text-align: center; }
  .mark { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 20px;
          background: linear-gradient(135deg, #6366f1, #7c3aed); display: grid; place-items: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.5; color: #64748b; margin: 0 0 24px; }
  button { min-height: 48px; width: 100%; border: 0; border-radius: 16px; font-size: 15px; font-weight: 600;
           color: #fff; background: #4f46e5; }
  button:active { background: #4338ca; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
  </div>
  <h1>You're offline</h1>
  <p>ScanSolve needs a connection to load your issues. Check your signal or Wi-Fi, then try again.</p>
  <button onclick="location.href='https://scansolve.co/dashboard'">Try again</button>
</main>
</body>
</html>
